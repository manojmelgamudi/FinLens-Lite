services:
  - type: web
    name: finlens
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GAS_WEB_APP_URL
        sync: false
      - key: GAS_API_SECRET
        sync: false
      - key: FINANCE_RECOVERY_KEY
        sync: false
